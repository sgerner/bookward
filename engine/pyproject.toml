[project]
name = "bookward-engine"
version = "0.1.0"
description = "Independent ingestion and recommendation engine for Bookward"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.159.1",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "feedparser==6.0.14",
  "fastembed==0.9.0",
  "beautifulsoup4==4.15.0",
  "cryptography==50.0.2",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "python-multipart==0.0.32",
  "pydantic-settings==2.16.1",
  "argon2-cffi==25.1.0",
  "pyjwt[crypto]==2.15.1",
]

[project.optional-dependencies]
local-model = ["sentence-transformers==6.2.0"]
dev = ["pytest==9.1.1", "respx==0.23.1"]

[tool.uv]
# FastEmbed currently caps Pillow below 13.0.0; this engine uses TextEmbedding only.
override-dependencies = ["pillow==13.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterword_engine"]
