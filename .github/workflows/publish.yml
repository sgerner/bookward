name: Publish containers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-ref:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag for publishing
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Select a vMAJOR.MINOR.PATCH tag to publish a release.' >&2
            exit 1
          fi

  checks:
    needs: release-ref
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GHCR images
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine latest release
        id: release
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          newest=$(git tag --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !seen++')
          if [[ "$RELEASE" == "$newest" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract web image metadata
        id: web-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bookward
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=bookward

      - name: Extract engine image metadata
        id: engine-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bookward-engine
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=bookward-engine

      - name: Publish Bookward image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          sbom: true
          tags: ${{ steps.web-metadata.outputs.tags }}
          labels: ${{ steps.web-metadata.outputs.labels }}
          cache-from: type=gha,scope=publish-bookward
          cache-to: type=gha,mode=max,scope=publish-bookward

      - name: Publish engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./engine
          push: true
          sbom: true
          tags: ${{ steps.engine-metadata.outputs.tags }}
          labels: ${{ steps.engine-metadata.outputs.labels }}
          cache-from: type=gha,scope=publish-bookward-engine
          cache-to: type=gha,mode=max,scope=publish-bookward-engine
