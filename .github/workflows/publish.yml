name: Publish containers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/bookward
            ghcr.io/${{ github.repository_owner }}/bookward-engine
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Publish Bookward image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bookward:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/bookward:latest
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=publish-bookward
          cache-to: type=gha,mode=max,scope=publish-bookward

      - name: Publish engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./engine
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bookward-engine:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/bookward-engine:latest
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=publish-bookward-engine
          cache-to: type=gha,mode=max,scope=publish-bookward-engine
