name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and Svelte checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  engine:
    name: Engine checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install engine dependencies
        run: uv sync --project engine --extra dev --frozen

      - name: Verify container dependency export
        run: uv export --project engine --locked --no-dev --format requirements.txt --no-annotate --no-header --no-emit-project | diff -u engine/requirements.lock -

      - name: Engine tests
        run: uv run --project engine pytest -q engine/tests

      - name: Python compilation
        run: uv run --project engine python -m compileall -q engine/afterword_engine

  containers:
    name: Container builds
    needs: [web, engine]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Bookward image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: bookward:ci
          cache-from: type=gha,scope=bookward
          cache-to: type=gha,mode=max,scope=bookward

      - name: Build engine image
        uses: docker/build-push-action@v7
        with:
          context: ./engine
          push: false
          tags: bookward-engine:ci
          cache-from: type=gha,scope=bookward-engine
          cache-to: type=gha,mode=max,scope=bookward-engine
