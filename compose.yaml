services:
  afterword:
    build: .
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    environment:
      ORIGIN: ${ORIGIN:-}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-}
      HOST_HEADER: ${HOST_HEADER:-}
      ENGINE_URL: http://engine:8000
      ENGINE_SERVICE_SECRET: ${ENGINE_SERVICE_SECRET:-}
      OIDC_AUTO_LOGIN: ${OIDC_AUTO_LOGIN:-false}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-12M}
    depends_on:
      engine:
        condition: service_healthy
    networks: ["books"]

  engine:
    build: ./engine
    restart: unless-stopped
    environment:
      AFTERWORD_DB: /data/afterword.db
      AFTERWORD_AUTH_USERNAME: ${AFTERWORD_AUTH_USERNAME:-bookward}
      AFTERWORD_AUTH_PASSWORD: ${AFTERWORD_AUTH_PASSWORD:-}
      AFTERWORD_SERVICE_SECRET: ${ENGINE_SERVICE_SECRET:-}
      AFTERWORD_OIDC_ISSUER: ${OIDC_ISSUER:-}
      AFTERWORD_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      AFTERWORD_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      AFTERWORD_OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      AFTERWORD_OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
      AFTERWORD_EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
      AFTERWORD_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hashing-768}
      AFTERWORD_EMBEDDING_URL: ${EMBEDDING_URL:-http://ollama:11434}
      AFTERWORD_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      AFTERWORD_SOURCE_SYNC_INTERVAL_HOURS: ${SOURCE_SYNC_INTERVAL_HOURS:-24}
      AFTERWORD_PUBLIC_URL: ${AFTERWORD_PUBLIC_URL:-http://127.0.0.1:3000}
      AFTERWORD_SECRET_KEY: ${AFTERWORD_SECRET_KEY:-}
      AFTERWORD_BACKUP_DIR: ${BACKUP_DIR:-/backups}
      AFTERWORD_BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      AFTERWORD_BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      AFTERWORD_LIBRARR_ALLOWED_HOSTS: ${LIBRARR_ALLOWED_HOSTS:-librarr}
      AFTERWORD_SMTP_ALLOWED_HOSTS: ${SMTP_ALLOWED_HOSTS:-}
      AFTERWORD_EXPLORATION_ENABLED: ${EXPLORATION_ENABLED:-false}
      AFTERWORD_EXPLORATION_EPSILON: ${EXPLORATION_EPSILON:-0.15}
      AFTERWORD_EXPLORATION_STABLE_TOP_K: ${EXPLORATION_STABLE_TOP_K:-8}
      AFTERWORD_LLM_RERANK_ENABLED: ${LLM_RERANK_ENABLED:-false}
      AFTERWORD_LLM_RERANK_API_URL: ${LLM_RERANK_API_URL:-https://api.openai.com/v1/chat/completions}
      AFTERWORD_LLM_RERANK_API_KEY: ${LLM_RERANK_API_KEY:-}
      AFTERWORD_LLM_RERANK_MODEL: ${LLM_RERANK_MODEL:-gpt-4o-mini}
      AFTERWORD_LLM_RERANK_ALLOWED_HOSTS: ${LLM_RERANK_ALLOWED_HOSTS:-}
      AFTERWORD_LLM_RERANK_TOP_K: ${LLM_RERANK_TOP_K:-24}
    volumes: ["afterword-data:/data", "afterword-backups:/backups"]
    expose: ["8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: ["books"]

  ollama:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    profiles: ["ollama"]
    restart: unless-stopped
    volumes: ["ollama-models:/root/.ollama"]
    expose: ["11434"]
    networks: ["books"]

volumes:
  afterword-data:
  afterword-backups:
  ollama-models:

networks:
  books:
