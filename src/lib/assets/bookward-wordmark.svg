<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" role="img" aria-labelledby="title desc">
  <title id="title">Bookward</title>
  <desc id="desc">Bookward, a personal reading discovery companion.</desc>
  <defs>
    <linearGradient id="wordmark-bg" x1="8" y1="8" x2="144" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7b72ff" />
      <stop offset="0.52" stop-color="#5c68e8" />
      <stop offset="1" stop-color="#dc6abd" />
    </linearGradient>
    <linearGradient id="wordmark-page" x1="35" y1="35" x2="115" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaff" />
      <stop offset="1" stop-color="#e9e7ff" />
    </linearGradient>
    <linearGradient id="wordmark-bookmark" x1="64" y1="30" x2="95" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe6a2" />
      <stop offset="1" stop-color="#ffbd68" />
    </linearGradient>
    <filter id="wordmark-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#241c58" flood-opacity="0.28" />
    </filter>
  </defs>
  <g transform="translate(8 8)">
    <rect width="144" height="144" rx="40" fill="url(#wordmark-bg)" />
    <path d="M5 61C19 18 56 4 95 8c23 2 38 17 45 33-25-14-49-16-68-3C52 22 25 28 5 61Z" fill="#fff" opacity="0.1" />
    <g filter="url(#wordmark-shadow)">
      <path d="M25 44c20 0 34 6 44 18v51c-11-12-25-19-44-19V44Z" fill="url(#wordmark-page)" />
      <path d="M119 44c-20 0-34 6-44 18v51c11-12 25-19 44-19V44Z" fill="url(#wordmark-page)" />
      <path d="M72 62v51" stroke="#a8a5df" stroke-width="3" stroke-linecap="round" />
      <path d="M37 60c12 2 22 6 29 12M37 74c12 2 21 6 28 11M107 60c-12 2-22 6-29 12M107 74c-12 2-21 6-28 11" fill="none" stroke="#beb9ed" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    </g>
    <path d="M54 32h36v34L72 54l-18 12V32Z" fill="url(#wordmark-bookmark)" stroke="#fff3ca" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="119" cy="28" r="3.5" fill="#fff4bd" opacity="0.8" />
  </g>
  <text x="184" y="91" fill="#f9f7ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="750" letter-spacing="-3">Bookward</text>
  <text x="188" y="122" fill="#c5c2e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650" letter-spacing="4.2">READ WITH INTENTION</text>
</svg>
