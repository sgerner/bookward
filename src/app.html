<!doctype html>
<html lang="en" data-theme="cerberus" data-mode="dark" data-color-scheme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		%sveltekit.head%
		<script>
			(() => {
				const themeColors = {
					catppuccin: { light: '#ffffff', dark: '#1e1e2e' },
					cerberus: { light: '#fcfcfc', dark: '#121212' },
					concord: { light: '#ffffff', dark: '#2b2b30' },
					crimson: { light: '#ffffff', dark: '#0c0e17' },
					dracula: { light: '#f5f8ff', dark: '#292b36' },
					fennec: { light: '#b9c0bc', dark: '#212227' },
					hamlindigo: { light: '#ffffff', dark: '#293247' },
					legacy: { light: '#ffffff', dark: '#1f2741' },
					mint: { light: '#89a89b', dark: '#1d3d36' },
					modern: { light: '#e0e0fe', dark: '#292e6e' },
					mona: { light: '#ffffff', dark: '#141d2b' },
					nosh: { light: '#f7f7f7', dark: '#030303' },
					nouveau: { light: '#fbf7fe', dark: '#070010' },
					pine: { light: '#d8dbd4', dark: '#1d2218' },
					reign: { light: '#cacaca', dark: '#3c3c3c' },
					rocket: { light: '#ffffff', dark: '#2c3645' },
					rose: { light: '#f7f2f9', dark: '#252228' },
					rosepine: { light: '#f9f4ee', dark: '#181625' },
					sahara: { light: '#fbe9ed', dark: '#66202c' },
					seafoam: { light: '#cbf1f7', dark: '#1f4052' },
					terminus: { light: '#fcfcfc', dark: '#131313' },
					vintage: { light: '#e3e3e3', dark: '#181410' },
					vox: { light: '#e7e3f9', dark: '#3b2a51' },
					wintry: { light: '#ffffff', dark: '#091224' }
				};
				const hasTheme = (value) => typeof value === 'string' && Object.prototype.hasOwnProperty.call(themeColors, value);
				const hasMode = (value) => value === 'light' || value === 'dark' || value === 'system';
				const root = document.documentElement;
				const systemDark = () => {
					try {
						return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
					} catch {
						return false;
					}
				};
				const readCookie = (name) => {
					try {
						const raw = document.cookie;
						if (typeof raw !== 'string' || !raw) return null;
						for (const part of raw.split(';')) {
							const trimmed = part.trim();
							const eq = trimmed.indexOf('=');
							if (eq < 0) continue;
							if (trimmed.slice(0, eq) === name) {
								const value = trimmed.slice(eq + 1);
								try {
									return decodeURIComponent(value);
								} catch {
									return value;
								}
							}
						}
					} catch {
						return null;
					}
					return null;
				};
				const writeCookie = (name, value) => {
					try {
						const secure = window.location?.protocol === 'https:' ? '; Secure' : '';
						document.cookie = `${name}=${value}; Path=/; Max-Age=31536000; SameSite=Lax${secure}`;
					} catch {
						// Ignore restricted cookie contexts.
					}
				};
				const setMetaThemeColor = (theme, resolvedMode) => {
					try {
						const meta =
							typeof document.querySelector === 'function'
								? document.querySelector('meta[name="theme-color"]')
								: typeof document.head?.querySelector === 'function'
									? document.head.querySelector('meta[name="theme-color"]')
									: null;
						if (!meta) return;
						const palette = themeColors[theme] || themeColors.cerberus;
						const color = resolvedMode === 'light' ? palette.light : palette.dark;
						if ('content' in meta) meta.content = color;
						if (typeof meta.setAttribute === 'function') meta.setAttribute('content', color);
					} catch {
						// Ignore missing or read-only head metadata.
					}
				};
				const hasThemeCss = (theme) => {
					if (theme === 'cerberus') return true;
					try {
						const selector = `style[data-bookward-theme="${theme}"]`;
						if (typeof document.head?.querySelector === 'function') {
							return Boolean(document.head.querySelector(selector));
						}
						if (typeof document.querySelector === 'function') {
							return Boolean(document.querySelector(selector));
						}
					} catch {
						return false;
					}
					return false;
				};
				try {
					const storedTheme = window.localStorage.getItem('bookward-theme');
					const legacyTheme = window.localStorage.getItem('afterword-theme');
					const localTheme = hasTheme(storedTheme) ? storedTheme : hasTheme(legacyTheme) ? legacyTheme : null;
					const storedMode = window.localStorage.getItem('bookward-color-mode');
					const legacyMode = window.localStorage.getItem('afterword-color-mode');
					const localMode = hasMode(storedMode) ? storedMode : hasMode(legacyMode) ? legacyMode : null;

					if (localTheme) writeCookie('bookward-theme', localTheme);
					if (localMode) writeCookie('bookward-color-mode', localMode);

					const cookieTheme = storedTheme === null && legacyTheme === null ? readCookie('bookward-theme') : null;
					const cookieMode = storedMode === null && legacyMode === null ? readCookie('bookward-color-mode') : null;

					const selectedTheme = localTheme ?? (hasTheme(cookieTheme) ? cookieTheme : 'cerberus');
					const selectedMode = localMode ?? (hasMode(cookieMode) ? cookieMode : 'dark');
					const activeTheme = hasThemeCss(selectedTheme) ? selectedTheme : 'cerberus';
					const resolvedMode = selectedMode === 'system' ? (systemDark() ? 'dark' : 'light') : selectedMode;

					root.dataset.theme = activeTheme;
					root.dataset.mode = selectedMode;
					root.dataset.colorScheme = resolvedMode;
					root.classList.toggle('dark', resolvedMode === 'dark');
					root.style.colorScheme = resolvedMode;
					setMetaThemeColor(activeTheme, resolvedMode);
				} catch {
					const cookieTheme = readCookie('bookward-theme');
					const cookieMode = readCookie('bookward-color-mode');
					const selectedTheme = hasTheme(cookieTheme) ? cookieTheme : 'cerberus';
					const selectedMode = hasMode(cookieMode) ? cookieMode : 'dark';
					const activeTheme = hasThemeCss(selectedTheme) ? selectedTheme : 'cerberus';
					const resolvedMode = selectedMode === 'system' ? (systemDark() ? 'dark' : 'light') : selectedMode;

					root.dataset.theme = activeTheme;
					root.dataset.mode = selectedMode;
					root.dataset.colorScheme = resolvedMode;
					root.classList.toggle('dark', resolvedMode === 'dark');
					root.style.colorScheme = resolvedMode;
					setMetaThemeColor(activeTheme, resolvedMode);
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
