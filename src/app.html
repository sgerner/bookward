<!doctype html>
<html lang="en" data-theme="cerberus" data-mode="system" data-color-scheme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(() => {
				const themes = ['catppuccin', 'cerberus', 'concord', 'crimson', 'dracula', 'fennec', 'hamlindigo', 'legacy', 'mint', 'modern', 'mona', 'nosh', 'nouveau', 'pine', 'reign', 'rocket', 'rose', 'rosepine', 'sahara', 'seafoam', 'terminus', 'vintage', 'vox', 'wintry'];
				const root = document.documentElement;
				const systemDark = () => {
					try {
						return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
					} catch {
						return false;
					}
				};
				try {
					const storedTheme = window.localStorage.getItem('bookward-theme');
					const legacyTheme = window.localStorage.getItem('afterword-theme');
					const theme = themes.includes(storedTheme ?? '') ? storedTheme : legacyTheme;
					const storedMode = window.localStorage.getItem('bookward-color-mode');
					const legacyMode = window.localStorage.getItem('afterword-color-mode');
					const mode = storedMode === 'light' || storedMode === 'dark' || storedMode === 'system' ? storedMode : legacyMode;
					const selectedTheme = themes.includes(theme ?? '') ? theme : 'cerberus';
					const selectedMode = mode === 'light' || mode === 'dark' || mode === 'system' ? mode : 'system';
					const resolvedMode = selectedMode === 'system' ? (systemDark() ? 'dark' : 'light') : selectedMode;
					root.dataset.theme = selectedTheme;
					root.dataset.mode = selectedMode;
					root.dataset.colorScheme = resolvedMode;
					root.classList.toggle('dark', resolvedMode === 'dark');
					root.style.colorScheme = resolvedMode;
				} catch {
					root.dataset.mode = 'system';
					root.dataset.colorScheme = systemDark() ? 'dark' : 'light';
					root.classList.toggle('dark', root.dataset.colorScheme === 'dark');
					root.style.colorScheme = root.dataset.colorScheme;
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
